name: 构建并部署

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coding-plan-usage-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并部署到服务器
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 测试
        run: go test -race ./...

      - name: 静态检查
        run: go vet ./...

      - name: 构建 Linux 二进制
        shell: bash
        env:
          DEPLOY_GOARCH: ${{ vars.DEPLOY_GOARCH || 'amd64' }}
        run: |
          set -euo pipefail

          case "$DEPLOY_GOARCH" in
            amd64|arm64) ;;
            *)
              echo "::error::DEPLOY_GOARCH 只支持 amd64 或 arm64"
              exit 1
              ;;
          esac

          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH="$DEPLOY_GOARCH" \
            go build -trimpath -ldflags="-s -w" \
            -o dist/coding-plan-usage ./cmd/coding-plan-usage

      - name: SCP 上传二进制
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: dist/coding-plan-usage
          target: /tmp/coding-plan-usage-${{ github.sha }}-${{ github.run_attempt }}
          strip_components: 1

      - name: 原子替换并重启服务
        uses: appleboy/ssh-action@v1.2.5
        env:
          STAGING_DIR: /tmp/coding-plan-usage-${{ github.sha }}-${{ github.run_attempt }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/usr/local/bin/coding-plan-usage' }}
          DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'coding-plan-usage.service' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: STAGING_DIR,DEPLOY_PATH,DEPLOY_SERVICE
          script: |
            set -e

            staging_path="$STAGING_DIR/coding-plan-usage"
            next_path="${DEPLOY_PATH}.new"

            cleanup() {
              rm -f "$staging_path"
              rmdir "$STAGING_DIR" 2>/dev/null || true
            }
            trap cleanup EXIT

            sudo -n install -m 0755 "$staging_path" "$next_path"
            sudo -n mv -f "$next_path" "$DEPLOY_PATH"
            sudo -n systemctl restart "$DEPLOY_SERVICE"
            sudo -n systemctl is-active --quiet "$DEPLOY_SERVICE"
