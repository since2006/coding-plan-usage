version: 1

accounts:
  - name: volc-account
    provider: volcengine
    access_key_id: AK_REPLACE_ME
    secret_access_key: SK_REPLACE_ME
  - name: zhipu-account
    provider: zhipu
    api_key: ZHIPU_CODING_PLAN_API_KEY_REPLACE_ME

# 不需要企业微信通知时，删除整个 wecom 配置块。
wecom:
  webhook_url: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=REPLACE_ME
  # 可选：企业微信智能机器人使用 URL 回调接入。三个字段必须同时配置。
  # bot:
  #   listen_address: :8080
  #   token: REPLACE_ME
  #   encoding_aes_key: REPLACE_WITH_43_CHARACTER_ENCODING_AES_KEY

# 不需要飞书通知时，删除整个 feishu 配置块。
feishu:
  webhook_url: https://open.feishu.cn/open-apis/bot/v2/hook/REPLACE_ME
  # 未开启飞书机器人的“签名校验”时可删除 secret。
  secret: REPLACE_ME

schedule:
  timezone: Asia/Shanghai
  poll_interval: 10m
  daily_at:
    - "09:00"
    - "18:00"

alert:
  threshold_percent: 90

state:
  file: ./data/state.json
