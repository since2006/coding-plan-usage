version: 1

accounts:
  - name: volc-account
    provider: volcengine
    access_key_id: AK_REPLACE_ME
    secret_access_key: SK_REPLACE_ME
  - name: zhipu-account
    provider: zhipu
    api_key: ZHIPU_CODING_PLAN_API_KEY_REPLACE_ME

wecom:
  webhook_url: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=REPLACE_ME

schedule:
  timezone: Asia/Shanghai
  poll_interval: 10m
  daily_at: "09:00"

alert:
  threshold_percent: 90

state:
  file: ./data/state.json
